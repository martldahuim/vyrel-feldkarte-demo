<title>VYREL Häcksler · Vorführung</title>
<!--
  ============================================================================
  VYREL · TESTTAG — die Anzeige für Feldtest 1 (RTK ohne Kamera)
  ============================================================================

  Stand 30.09.2026. Ersetzt die Anzeige vom 29.09. Die Daten, die Rolle,
  die Regeln gegen eingefrorene Zahlen und die Fahrzeugmaße sind dieselben;
  neu sind die Optik und drei Ansichten. Seit dem Nachmittag des 30.09.
  trägt die Anzeige den Namen VYREL statt Franz (claude/NAMENSORDNUNG.md).

  Optik aus claude/VYREL_HMI_Vorfuehrung.html übernommen:
    Befehlsleiste "kontrast-groß" mit laufenden Pfeilen, Tempo-Instrumente
    mit Bogen, Leiste unter der Befehlsleiste, Glas-Tafeln, runde Tasten,
    Kettenband als Pille, Rollenfarben (Leitmaschine kühles Blaugrau,
    Gespann warmes Grau), Tag und Nacht als zwei eigene Farbsätze.

  Was bewusst anders ist als in der Vorführung, und warum:

    Keine Fahranweisung. Test 1 misst, er führt nicht. Die Befehlsleiste
    trägt deshalb die Güte der Messung (RTK FIX / NUR FLOAT / KEIN RTK)
    und als große Zahl den Längsversatz — die Hauptaussage des Tests.
    Die Leiste darunter zeigt die Längslage statt der Befüllzone.

    Keine Schrift aus dem Netz. Die Vorführung lädt IBM Plex von Google;
    im Feld gibt es kein Internet. Hier stehen Plex nur noch als Wunsch
    vorn in der Liste, danach Roboto (Fire OS) und die Systemschrift.

    Die Rolle wird nicht gewählt. Der Knoten wurde mit ihr gestartet.

  Neu:
    MASSBAND    Bandmessung gegen das RTK-Mittel der letzten 5 s
    PRÜFLISTE   die Schritte des Feldtags, abhakbar, mit Notiz
    Ansagen     ruhige Sätze mit Zweiklang: FIX, Funk, Verbindung, dran
    Protokoll   jede Ansage, jeder Alarm, jeder Ansichtswechsel geht an
                den Pi (/hmi) und steht in *_testtag.jsonl

  Unverändert wichtig:
    Eine Zahl, die nicht mehr erneuert wird, verschwindet. Die Seite prüft
    selbst, wann der Pi zuletzt geantwortet hat — nach der Uhr DIESES
    Tablets, nie nach der des Pi.
  ============================================================================
-->
<style>
:root{
  --grund:#06090d; --grund2:#0b1017; --grund3:#101823;
  --karte:rgba(150,180,215,.055); --karte-voll:#0f151d; --karte-hoch:#17202b;
  --linie:rgba(150,185,220,.13); --linie-hell:rgba(150,185,220,.24);
  --gold:#e9ae47; --gold-hell:#ffd47e; --gold-tief:#3a2a0d; --auf-farbe:#15100a;
  --mess:#5fd8ea; --mess-tief:#0d3a44;
  --text:#eef3f7; --still:rgba(208,222,236,.56); --leise:rgba(208,222,236,.2);
  --gruen:#34c26b; --gelb:#f0c332; --rot:#ef4a3e; --auf-rot:#ffffff;
  --schein:.55;
  --lead:#8aa0b8; --lead-tief:#3c4b5c; --gespann:#b0a597; --gespann-tief:#5d5549;
  --feld:#0d110b; --raster:rgba(95,216,234,.07); --raster-stark:rgba(95,216,234,.16);
  --f-text:"IBM Plex Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-eng:"IBM Plex Sans Condensed", "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", Roboto, system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
  --rund:14px; --rund-gross:20px;
  color-scheme:dark;
}
/* Tag: gegen Sonne, nicht die Nacht heller gedreht. */
:root.tag{
  --grund:#e9ecef; --grund2:#dfe4e9; --grund3:#d4dae1;
  --karte:rgba(255,255,255,.72); --karte-voll:#ffffff; --karte-hoch:#ffffff;
  --linie:rgba(20,40,60,.13); --linie-hell:rgba(20,40,60,.24);
  --gold:#935f05; --gold-hell:#6a4403; --gold-tief:#f3e3c0; --auf-farbe:#fffaf0;
  --mess:#0a7f95; --mess-tief:#d3eef3;
  --text:#0f151b; --still:rgba(15,21,27,.6); --leise:rgba(15,21,27,.22);
  --gruen:#128140; --gelb:#a37300; --rot:#b3261e; --auf-rot:#ffffff;
  --schein:0;
  --lead:#56697d; --lead-tief:#2e3a46; --gespann:#8a7f71; --gespann-tief:#4d463d;
  --feld:#f4f6f7; --raster:rgba(10,90,110,.10); --raster-stark:rgba(10,90,110,.22);
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--grund);color:var(--text);
  font-family:var(--f-text);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

#geraet{position:relative;display:flex;flex-direction:column;height:100%;color:var(--text);overflow:hidden;background:var(--grund);
  background:radial-gradient(120% 60% at 50% -10%,var(--grund3),transparent 60%),linear-gradient(180deg,var(--grund2),var(--grund))}

/* ------------------------------------------------------------------ Kopf */
.kopf{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 14px;height:clamp(38px,6vh,48px);font-size:12px}
.kopf .rolle{font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);white-space:nowrap;font-size:12px;display:flex;align-items:center;gap:8px}
.kopf .rolle::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--gold);box-shadow:0 0 12px rgba(233,174,71,var(--schein))}
.kopf .schlag{color:var(--still);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kopf .rechts{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.stat{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--still)}
.punkt{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--rot)}
.balken4{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.balken4 i{display:block;width:3px;background:var(--leise);border-radius:1px}
.balken4 i:nth-child(1){height:4px}.balken4 i:nth-child(2){height:6px}.balken4 i:nth-child(3){height:9px}.balken4 i:nth-child(4){height:12px}
.balken4.b1 i:nth-child(-n+1),.balken4.b2 i:nth-child(-n+2),.balken4.b3 i:nth-child(-n+3),.balken4.b4 i{background:var(--text)}
.balken4.aus i{background:var(--rot);opacity:.6}
.uhrzeit{font:600 14px var(--f-eng);color:var(--text);letter-spacing:.04em}
.knopfklein{background:var(--karte);color:var(--still);border:0;box-shadow:inset 0 0 0 1px var(--linie);border-radius:999px;
  font-size:11px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.knopfklein:active{background:var(--karte-hoch)}
.knopfklein.an{color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-tief)}
@media (max-width:560px){.kopf .schlag,.kopf .uhrzeit{display:none}.kopf{gap:8px;padding:0 10px}.kopf .rechts{gap:7px}}

/* ------------------------------------------------------------------ Band */
.band{flex:0 0 auto;display:flex;align-items:center;gap:10px;margin:0 8px;padding:6px 12px;border-radius:999px;
  background:var(--karte);box-shadow:inset 0 0 0 1px var(--linie);font-size:13px;white-space:nowrap;overflow:hidden;min-height:30px}
.band .bandmarke{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--still);flex:0 0 auto;font-weight:700}
.band .bandtext{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.band .bandzahl{flex:0 0 auto;color:var(--still);font-size:12px}
.band.dran{background:linear-gradient(90deg,var(--gold-tief),transparent 90%);box-shadow:inset 0 0 0 1px var(--gold-tief)}.band.dran .bandtext{color:var(--gold-hell)}
.band.wartet .bandtext{color:var(--gelb)}.band.leer .bandtext{color:var(--still);font-weight:600}

.alarm{flex:0 0 auto;margin:6px 8px 0;border-radius:12px;background:var(--rot);color:var(--auf-rot);padding:7px 10px;text-align:center;
  font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;animation:puls 1.4s ease-in-out infinite}
@keyframes puls{50%{box-shadow:0 0 0 4px rgba(239,74,62,.25);filter:brightness(.85)}}

/* ---------------------------------------------------------- Befehlsleiste
   Aus der Vorführung. Hier trägt sie die Güte der Messung und den
   Längsversatz — Test 1 misst, er führt nicht. */
.befehl{--bw:min(clamp(30px,8.4vh,92px),11vw);--farbe:var(--gold);--auf:var(--auf-farbe);
  position:relative;flex:0 0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;
  gap:clamp(10px,2vw,22px);margin:8px 8px 0;padding:clamp(8px,1.5vh,15px) clamp(14px,2.4vw,26px);
  min-height:clamp(72px,15vh,150px);border-radius:var(--rund-gross);overflow:hidden;color:var(--auf);
  background:var(--farbe);
  background:linear-gradient(135deg,var(--farbe),color-mix(in srgb,var(--farbe) 78%,#000));
  box-shadow:0 10px 40px -12px color-mix(in srgb,var(--farbe) calc(var(--schein)*100%),transparent),inset 0 1px 0 rgba(255,255,255,.25);
  transition:background .3s,box-shadow .3s}
.befehl::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 45%);pointer-events:none}
.befehl.gruen{--farbe:var(--gruen);--auf:#fff}
.befehl.rot{--farbe:var(--rot);--auf:var(--auf-rot)}
.befehl.gelb{--farbe:var(--gelb);--auf:#15110a;background:repeating-linear-gradient(-45deg,var(--gelb) 0 22px,color-mix(in srgb,var(--gelb) 80%,#000) 22px 44px)}
.befehl.still{--farbe:var(--karte-voll);--auf:var(--text);background:var(--karte);box-shadow:inset 0 0 0 1px var(--linie)}
.befehl.still .psym{color:var(--gold)}
.befehl .pfeil{position:relative;width:clamp(44px,8vh,88px);height:clamp(50px,10vh,110px);display:grid;place-items:center}
.befehl .psym{font:700 clamp(30px,7vh,80px)/1 var(--f-eng)}
.befehl .chev{position:absolute;inset:0;display:none}
.befehl .chev i{position:absolute;left:50%;width:58%;aspect-ratio:1;border:solid currentColor;border-width:clamp(5px,.9vh,9px) clamp(5px,.9vh,9px) 0 0;
  transform:translate(-50%,-50%) rotate(-45deg);opacity:0;animation:chev 1.2s linear infinite}
.befehl .chev i:nth-child(2){animation-delay:.4s}.befehl .chev i:nth-child(3){animation-delay:.8s}
@keyframes chev{0%{top:85%;opacity:0}25%{opacity:1}75%{opacity:1}100%{top:18%;opacity:0}}
.befehl.vor .chev,.befehl.zurueck .chev{display:block}
.befehl.vor .psym,.befehl.zurueck .psym{display:none}
.befehl.zurueck .chev{transform:scaleY(-1)}
.befehl .bw{margin:0;font:700 calc(var(--bw) * var(--f,1))/.95 var(--f-eng);letter-spacing:.005em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.befehl .bs{margin-top:clamp(4px,.8vh,9px);font-size:clamp(12px,1.9vh,17px);font-weight:600;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.befehl .bz{text-align:right;font:700 clamp(30px,8vh,86px)/1 var(--f-eng);white-space:nowrap}
.befehl .bz small{display:block;font:600 clamp(10px,1.4vh,12px)/1.2 var(--f-text);letter-spacing:.14em;text-transform:uppercase;opacity:.78;margin-top:5px}
@media (max-width:560px){.befehl{--bw:min(8vh,11vw);gap:10px;padding:10px 12px}
  .befehl .bs{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .befehl .pfeil{width:30px;height:54px}.befehl .psym{font-size:30px}.befehl .bz{font-size:clamp(24px,8.5vw,40px)}}

/* ------------------------------------------------------------ Tempo */
.tempo{flex:0 0 auto;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;margin:8px 8px 0}
.tinst{position:relative;background:var(--karte);border-radius:var(--rund);box-shadow:inset 0 0 0 1px var(--linie);
  padding:clamp(6px,1.2vh,12px) 12px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.tinst .tm{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--still);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tinst .tz{font:700 clamp(24px,5.4vh,54px)/1 var(--f-eng);letter-spacing:-.01em;white-space:nowrap;margin-top:3px}
.tinst .tz small{font:500 clamp(10px,1.5vh,13px) var(--f-text);color:var(--still);margin-left:4px;letter-spacing:0}
.tinst .tu{font-size:clamp(10.5px,1.5vh,12.5px);color:var(--still);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tinst.gold .tz{color:var(--gold)}
.tinst.ich{align-items:center;text-align:center;justify-content:flex-end;padding-top:clamp(14px,3vh,30px);padding-bottom:clamp(5px,1vh,9px);min-height:clamp(84px,15vh,150px)}
.tinst.ich{overflow:hidden}
.tinst.ich svg{position:absolute;left:0;right:0;top:4px;width:100%;height:calc(100% + 26px)}
.tinst.ich .tz{position:relative;order:1;font-size:clamp(26px,5.6vh,56px);margin-top:0}
.tinst.ich .tm{position:relative;order:2;margin-top:2px}
.tinst.ich .delta{order:3}
.tinst .delta{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:999px;font:700 clamp(11px,1.6vh,13px) var(--f-eng);background:var(--leise);color:var(--text);position:relative;white-space:nowrap}
.tinst .delta.plus{background:var(--gold);color:var(--auf-farbe)}
.tinst .delta.minus{background:var(--mess);color:#03141a}
.tinst .delta.gut{background:var(--gruen);color:#fff}
.bogen-grund{fill:none;stroke:var(--leise);stroke-linecap:round}
.bogen-wert{fill:none;stroke:var(--text);stroke-linecap:round}
.bogen-h{stroke:var(--mess);stroke-linecap:round}
.tempo.veraltet .tinst{opacity:.38}
@media (max-width:560px){.tempo{gap:6px}.tinst{padding:6px 8px}.tinst .tu{display:none}
  .tinst:not(.ich) .tz small{display:none}.tinst .tz{font-size:clamp(22px,5vh,36px)}
  .tinst.ich .tz{font-size:clamp(22px,4.4vh,34px)}.tinst.ich{padding-top:clamp(18px,4vh,32px)}}

/* --------------------------------------------------------- Längslage
   Dieselbe Leiste wie die Stellungsleiste der Vorführung. Hier zeigt sie
   die Lage des Abfahrers längs zum Häcksler: 0 ist der Häcksler, rechts
   ist vorn. Die Messfarbe ist der Abfahrer; ist die Lage nicht auf
   Zentimeter genau, wird der Punkt so breit wie seine Unsicherheit. */
.lage{flex:0 0 auto;margin:8px 8px 0;padding:clamp(6px,1.1vh,10px) 12px clamp(6px,1.1vh,10px);background:var(--karte);border-radius:var(--rund);box-shadow:inset 0 0 0 1px var(--linie)}
.lg-kopf{display:flex;justify-content:space-between;gap:10px;font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--still);white-space:nowrap}
.lg-kopf b{color:var(--text);letter-spacing:.06em;font-size:11px;overflow:hidden;text-overflow:ellipsis}
.lg-bahn{position:relative;height:clamp(22px,3.8vh,34px);margin-top:clamp(5px,1vh,8px);border-radius:8px;background:var(--karte-voll);box-shadow:inset 0 0 0 1px var(--linie);overflow:visible}
.lg-strich{position:absolute;top:0;bottom:0;width:1px;background:var(--linie-hell)}
.lg-haecksler{position:absolute;top:3px;bottom:3px;border-radius:5px;background:var(--lead);opacity:.9}
.lg-null{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:var(--lead);border-radius:2px}
.lg-ist{position:absolute;top:50%;width:clamp(16px,2.6vh,22px);height:clamp(16px,2.6vh,22px);transform:translate(-50%,-50%);border-radius:50%;
  background:var(--mess);box-shadow:0 0 0 3px var(--karte-voll),0 0 16px var(--mess);transition:left .2s linear,width .2s}
.lg-ist.unscharf{border-radius:999px;background:color-mix(in srgb,var(--gelb) 40%,transparent);box-shadow:0 0 0 2px var(--gelb)}
.lg-ist.aus{display:none}
.lg-skala{position:relative;height:13px;margin-top:3px;font-size:9.5px;color:var(--still)}
.lg-skala span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.lg-skala span:first-child{transform:none}.lg-skala span:last-child{transform:translateX(-100%)}

/* ---------------------------------------------------------------- Fläche */
.flaeche{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:8px;gap:8px}
.umschalter{flex:0 0 auto;display:flex;gap:4px;padding:3px;background:var(--karte);border-radius:999px;box-shadow:inset 0 0 0 1px var(--linie)}
.umschalter button{flex:1 1 0;min-height:clamp(30px,4.6vh,38px);background:transparent;color:var(--still);border:0;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.umschalter button.an{color:var(--auf-farbe);background:var(--gold)}
.tafel{flex:1 1 auto;min-height:0;padding:clamp(8px,1.4vh,14px) 12px;overflow:hidden;background:var(--karte);border-radius:var(--rund-gross);
  box-shadow:inset 0 0 0 1px var(--linie);display:flex;flex-direction:column}
.tafel.rollt{overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (min-width:780px){
  .flaeche{flex-direction:row}
  .umschalter{display:none}
  .tafel{flex:1 1 0;width:0}
  .tafel.mitte{flex:1.35 1 0}
  .tafel.breit2{flex:1.6 1 0}
}
.marke{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--still);margin:0 0 clamp(5px,1vh,9px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
* + .marke.abst{margin-top:clamp(8px,1.8vh,16px)}
.zusatz{margin-top:clamp(3px,.9vh,9px);font-size:clamp(11.5px,1.8vh,14px);color:var(--still);line-height:1.45}
.erklaerung{font-size:12.5px;color:var(--still);line-height:1.5;margin:-2px 0 8px}

/* ---------------------------------------------------------------- Werte */
.werte{flex:0 0 auto}
.wertzeile{display:flex;align-items:baseline;gap:12px;padding:clamp(4px,1vh,9px) 2px;box-shadow:inset 0 -1px 0 var(--linie)}
.wertzeile:last-child{box-shadow:none}
.wertname{font-size:clamp(11.5px,1.8vh,14px);color:var(--still);white-space:nowrap}
.wertzahl{margin-left:auto;font:700 clamp(16px,3vh,27px)/1.1 var(--f-eng);white-space:nowrap}
.wertzahl.gold{color:var(--gold)}.wertzahl.still{color:var(--leise)}.wertzahl.rot{color:var(--rot)}.wertzahl.gruen{color:var(--gruen)}.wertzahl.gelb{color:var(--gelb)}
.einheit{font:500 .55em var(--f-text);color:var(--still);margin-left:3px}

/* ------------------------------------------------------------ Leinwand */
.leinwand{position:relative;flex:1 1 auto;min-height:70px;border-radius:var(--rund);overflow:hidden;background:var(--feld);box-shadow:inset 0 0 0 1px var(--linie)}
.leinwand canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.leinwand .lband{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.88);
  background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
:root.tag .leinwand .lband{color:rgba(0,0,0,.78);background:linear-gradient(transparent,rgba(255,255,255,.92))}

/* ---------------------------------------------------------------- Liste */
.liste{margin:0;padding:0;list-style:none;display:grid;gap:clamp(3px,.7vh,6px);flex:0 0 auto}
.listzeile{display:flex;align-items:center;gap:10px;background:var(--karte-voll);border-radius:12px;box-shadow:inset 0 0 0 1px var(--linie);
  padding:clamp(5px,1.1vh,10px) 11px;font-size:clamp(12px,1.85vh,14.5px);overflow:hidden;min-width:0}
.listicon{flex:0 0 auto;width:clamp(14px,2.3vh,19px);height:clamp(14px,2.3vh,19px);color:var(--still)}
.listicon svg{width:100%;height:100%;display:block}
.listname{flex:0 0 auto;max-width:64%;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listwert{flex:1 1 auto;text-align:right;min-width:0;margin-left:auto;padding-left:8px;font-size:.9em;color:var(--still);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeichen{flex:0 0 auto;margin-left:10px;width:clamp(16px,2.5vh,21px);height:clamp(16px,2.5vh,21px);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--leise)}
.zeichen svg{width:62%;height:62%}
.zeichen.gut{background:var(--gruen)}.zeichen.warn{background:var(--gelb);color:#15110a}.zeichen.fehlt{background:var(--rot)}

/* ---------------------------------------------------------------- Kette */

.taste:active{background:var(--karte-hoch)}
.taste.an{background:var(--gold);color:var(--auf-farbe);box-shadow:none}.taste.an small{color:var(--auf-farbe);opacity:.75}

function probeSpeichern(){

   Ausweis neu an, und in dieser Anmeldung fahren die Maße mit. */

    .then(function(a){return a.json()}).then(function(k){if(Daten)Daten.kennung=k;return k}).catch(function(){return null});

    eigeneBereiche().forEach(function(bereich){
      var block={},werte=(Konfig&&Konfig[bereich])||{};

/* ================================================================ Sprache
   Ruhig, in ganzen Sätzen, mit weichem Zweiklang davor. Nicht plappern:
   ein Zustand muss erst stehen (FIX 2 s, Funk 2 s), gleiche Ansage
   frühestens nach 8 s, zwei Ansagen mindestens 2,5 s auseinander. Jede
   Ansage geht ins Protokoll auf dem Pi. */
var TON=speicherAlt("vyrel_ton","franz_ton")!=="aus";
var AUDIO=null,STIMMEN=[],STIMME=null,letzteZeit=0,gesagt={},ANSAGEN=[];
function stimmenLaden(){
  if(!window.speechSynthesis)return;
  var alle=window.speechSynthesis.getVoices()||[];
  STIMMEN=alle.filter(function(v){return /^de(-|_|$)/i.test(v.lang)}).map(function(v){
    var p=0;if(/de-DE/i.test(v.lang))p+=3;if(/(Premium|Enhanced|Natural|Neural|Erweitert)/i.test(v.name))p+=6;if(v.localService)p+=2;
    if(/(Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley|Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Jester|Organ|Trinoids|Whisper|Wobble|Zarvox)/i.test(v.name))p-=10;
    return {v:v,p:p};
  }).sort(function(a,b){return b.p-a.p}).map(function(x){return x.v});
  if(!STIMME||STIMMEN.indexOf(STIMME)<0)STIMME=STIMMEN[0]||null;
}
if(window.speechSynthesis){stimmenLaden();try{window.speechSynthesis.addEventListener("voiceschanged",stimmenLaden)}catch(e){window.speechSynthesis.onvoiceschanged=stimmenLaden}}
function klang(art){
  if(!AUDIO)return;
  try{
    if(AUDIO.state==="suspended")AUDIO.resume();
    var folge=art==="rot"?[[740,0],[554,.22],[740,.44]]:art==="gruen"?[[587,0],[880,.16]]:art==="gelb"?[[660,0],[660,.2]]:[[880,0],[659,.16]];
    var t0=AUDIO.currentTime+.02;
    folge.forEach(function(n){[1,2].forEach(function(ob){
      var o=AUDIO.createOscillator(),g=AUDIO.createGain();o.type="sine";o.frequency.value=n[0]*ob;
      var t=t0+n[1],sp=ob===1?.16:.035;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(sp,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.9);
      o.connect(g);g.connect(AUDIO.destination);o.start(t);o.stop(t+1);
    })});
  }catch(e){}
}
function sagen(text,art,sofort){
  var jetzt=performance.now()/1000;
  if(!sofort&&jetzt-letzteZeit<2.5)return false;
  if(!sofort&&gesagt[text]&&jetzt-gesagt[text]<8)return false;
  gesagt[text]=jetzt;letzteZeit=jetzt;
  ANSAGEN.push({t:Date.now(),text:text,art:art,ton:TON});if(ANSAGEN.length>50)ANSAGEN.shift();
  hmi("ansage",text+(TON?"":" [stumm]"));
  if(!TON)return true;
  klang(art);
  if(window.speechSynthesis){
    try{
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);u.lang="de-DE";if(STIMME)u.voice=STIMME;u.rate=.93;u.pitch=1;u.volume=1;
      setTimeout(function(){window.speechSynthesis.speak(u)},art==="rot"?520:340);
    }catch(e){}
  }
  return true;
}
function zahlWort(x){var t=fmt(x,1);return t.replace(",0","").replace(","," Komma ")}

/* Zustände, die angesagt werden. Jeder muss eine Weile stehen, bevor er
   gilt — sonst redet das Tablet bei jedem 5-Hz-Flackern. */
var Z={};
function zustand(name,wert,halteS){
  var s=Z[name],jetzt=performance.now()/1000;
  if(!s){Z[name]={wert:wert,kandidat:wert,seit:jetzt,erst:true};return null}
  if(wert!==s.kandidat){s.kandidat=wert;s.seit=jetzt;return null}
  if(wert!==s.wert&&jetzt-s.seit>=halteS){var alt=s.wert;s.wert=wert;return {alt:alt,neu:wert}}
  return null;
}
/* Wird eine Ansage gerade nicht gesprochen (zu dicht an der vorigen), gilt
   der Wechsel als noch nicht gemeldet und kommt beim nächsten Takt wieder. */
function melde(name,w,text,art,sofort){if(sagen(text,art,sofort)===false)Z[name].wert=w.alt}
function ansagenPruefen(){
  if(!Rolle)return;
  var weg=verbindungWeg(),w;
  w=zustand("rechner",weg?"weg":"da",2.0);
  if(w){if(w.neu==="weg")melde("rechner",w,"Verbindung zum Rechner unterbrochen.","rot",true);else melde("rechner",w,"Verbindung zum Rechner wieder da.","gruen")}
  if(weg)return;
  var v=frischerVektor(),g=!v?"kein":v.art==="fix"?"fix":v.art==="float"?"float":"grob";
  w=zustand("guete",g,2.0);
  if(w){
    if(w.neu==="fix")melde("guete",w,"R T K fix. Zentimeter.","gruen");
    else if(w.alt==="fix"&&w.neu==="float")melde("guete",w,"Achtung. Fix verloren. Nur Float.","gelb",true);
    else if(w.neu==="float")melde("guete",w,"Nur Float.","gelb");
    else if(w.neu==="grob")melde("guete",w,"Kein R T K. Nur Meter.","rot",true);
    else if(w.neu==="kein"&&(w.alt==="fix"||w.alt==="float"))melde("guete",w,"Kein Vektor.","rot",true);
  }
  var f=(Daten&&Daten.funk)||{};
  w=zustand("funk",f.verbunden?"steht":"weg",2.0);
  if(w){if(w.neu==="weg")melde("funk",w,"Funkverbindung zum anderen Fahrzeug abgerissen.","rot",true);else melde("funk",w,"Funkverbindung steht wieder.","gruen")}
  if(haeck()){
    var dr=dranZeile();
    w=zustand("dran",dr?(dr.name||dr.kennung):"",3.0);
    if(w&&w.neu)melde("dran",w,w.neu+" ist dran.","gold");
    var namen=kettenliste().filter(function(z){return z.zustand!=="bekannt"&&z.zustand!=="weg"}).map(function(z){return z.name||z.kennung}).sort().join("|");
    w=zustand("angemeldet",namen,1.0);
    if(w){var neu=w.neu.split("|").filter(function(n){return n&&w.alt.split("|").indexOf(n)<0});if(neu.length)melde("angemeldet",w,neu.join(" und ")+" angemeldet.","gold")}
  }else{
    var mein=ich(),s=mein&&mein.dran?"dran":mein&&mein.naechster?"naechster":"sonst";
    w=zustand("ich",s,2.0);
    if(w){if(w.neu==="dran")melde("ich",w,"Du bist dran.","gold");else if(w.neu==="naechster")melde("ich",w,"Du bist als Nächstes dran.","gold")}
  }
}

}

/* ================================================================ Bedienung */
geraet.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act]");if(!t)return;

  if(a==="licht"){licht(tag()?"nacht":"tag",true);return}
  if(a==="ton"){TON=!TON;speicher("vyrel_ton",TON?"an":"aus");hmi("taste","Ton "+(TON?"an":"aus"));if(TON)sagen("Ansagen sind an.","gold",true);aktualisieren();return}
  if(a==="auftrag"){hmi("sicht","auftrag");location.href=window.VYREL_AUFTRAG_URL||"/auftrag";return}
  if(a==="sicht"){if(UI.sicht!==arg){UI.sicht=arg;UI.tafel=0;Meldung=null;hmi("sicht",arg);if(arg==="massband"||arg==="pruefliste"||arg==="menue"||arg==="system")ttHolen()}aufbauen();return}
  if(a==="tafel"){UI.tafel=+arg;aufbauen();return}
  if(a==="fest"){var k=kette();festhalten(arg&&k.festgehalten===arg?"":arg);return}
  if(a==="messart"){UI.messart=arg;MB.fehler="";aktualisieren();return}
  if(a==="probe"){probeSpeichern();return}
  if(a==="haken"){var p=TT&&TT.pruefliste.punkte.filter(function(x){return x.id===arg})[0];if(p)pruefpunkt({id:arg,erledigt:!p.erledigt});return}
  if(a==="speichern"){konfigSpeichern();return}
  if(a==="verwerfen"){Entwurf={};Meldung=null;konfigHolen();return}
});

/* ================================================================ Takt */
function holen(){
  /* Nur eine echte Antwort zählt als Lebenszeichen. Eine Fehlerseite des
     Pi (500, 503) hieß vorher "Rechner antwortet" — und die Anzeige zeigte
     KEIN VEKTOR statt KEINE VERBINDUNG. */
  fetch("/daten",{cache:"no-store"}).then(function(a){if(!a.ok)throw new Error("HTTP "+a.status);return a.json()}).then(function(d){
    if(!d||typeof d!=="object"||!("bereit" in d))throw new Error("kein Anzeigebild");
    if(!gekoppelt(d)){aktualisieren();return}
    Daten=d;LetzterEmpfang=Date.now();
    if(d.rolle&&d.rolle!==Rolle){var erst=!Rolle;Rolle=d.rolle;if(erst){aufbauen();hmi("start","Anzeige geöffnet · "+navigator.userAgent.slice(0,120));return}}
    aktualisieren();
  }).catch(function(){aktualisieren()});
}
function knotenName(k){return (k.name||k.anzeigename||"")+" ("+(k.rolle==="abfahrer"?"Abfahrer":"Häcksler")+", "+(k.kennung||"?")+")"}
function sperreAuf(){
  var e=document.getElementById("sperre");
  if(!Fremd){e.hidden=true;e.innerHTML="";return}
  var netz=Kopplung.rolle==="abfahrer"?"VYREL-Abfahrer":"VYREL-Haecksler";
  e.innerHTML='<h1>FALSCHER RECHNER</h1>'+
    '<p>Dieses Tablet gehört zu <b>'+esc(knotenName(Kopplung))+'</b>.<br>Geantwortet hat <b>'+esc(knotenName(Fremd))+'</b>.</p>'+
    '<p>Keine Werte, keine Eingaben. WLAN des Tablets prüfen: Es muss im Netz <b class="mono">'+netz+'</b> sein.</p>'+
    '<button type="button" data-act="neukoppeln">Mit diesem Rechner neu koppeln …</button>';
  e.hidden=false;
}
/* Prüft jede Antwort gegen die Kopplung. Ohne UUID (alter Stand des Pi)
   ist keine Prüfung möglich, dann bleibt alles wie bisher. */
function gekoppelt(d){
  var k=d.kennung||{};
  if(!k.uuid)return true;
  if(!Kopplung)kopplungSetzen(k);
  if(k.uuid!==Kopplung.uuid){if(!Fremd||Fremd.uuid!==k.uuid){Fremd=k;sperreAuf()}return false}
  if(Fremd){Fremd=null;sperreAuf()}
  return true;
}
document.getElementById("sperre").addEventListener("click",function(ev){
  if(!ev.target.closest('[data-act="neukoppeln"]')||!Fremd)return;
  if(!window.confirm("Dieses Tablet ab jetzt fest an "+knotenName(Fremd)+" koppeln?\n\nNur tun, wenn das Tablet wirklich in diese Kabine gehört."))return;
  var vorher=Kopplung?Kopplung.kennung:"";
  kopplungSetzen(Fremd);Fremd=null;Rolle="";Daten=null;TT=null;sperreAuf();
  hmi("kopplung","Neu gekoppelt mit "+Kopplung.kennung+(vorher?", vorher "+vorher:""));
  holen();
});
function ttHolen(){
  if(Fremd)return;
  fetch("/testtag",{cache:"no-store"}).then(function(a){return a.ok?a.json():null}).then(function(j){if(j){TT=j;if(UI.sicht!=="fahren")aktualisieren()}}).catch(function(){});
}
holen();ttHolen();
setInterval(holen,400);

setInterval(function(){if(UI.sicht==="massband"||UI.sicht==="pruefliste")ttHolen()},1000);
setInterval(function(){if(UI.sicht!=="massband"&&UI.sicht!=="pruefliste")ttHolen()},5000);
/* Wächter, unabhängig vom Abruf: Hängt eine Anfrage, statt zu scheitern,
   kommt weder 'then' noch 'catch' — und ohne diesen Takt bliebe die
   letzte Zahl stehen. */
setInterval(function(){if(verbindungWeg())aktualisieren()},1000);
var alteBreite=window.innerWidth<780;
window.addEventListener("resize",function(){var s=window.innerWidth<780;if(s!==alteBreite){alteBreite=s;aufbauen()}else aktualisieren()});

aufbauen();

/* Für die Prüfung von außen. */
window.ansicht=function(n){UI.sicht=n==="konfig"?"fahrzeuge":n;UI.tafel=0;aufbauen()};
window.__ui=UI;window.__ansagen=ANSAGEN;window.__tafel=function(i){UI.tafel=i;aufbauen()};

})();
